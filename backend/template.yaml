AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: E-Swap serverless backend with Cognito, HTTP API, Lambda, DynamoDB and S3.

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact origin of the deployed frontend, without a trailing slash.
  AutoApproveListings:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Use true for a quick demo. Use false to demonstrate admin approval.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Handler: app.lambda_handler
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        ITEMS_TABLE: !Ref ItemsTable
        REQUESTS_TABLE: !Ref RequestsTable
        IMAGE_BUCKET: !Ref ImagesBucket
        AUTO_APPROVE_LISTINGS: !Ref AutoApproveListings
        IMAGE_URL_TTL_SECONDS: '3600'
        MAX_IMAGE_BYTES: '5242880'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub eswap-users-${StageName}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Application: E-Swap
        Stage: !Ref StageName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub eswap-web-${StageName}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ReadAttributes:
        - email
        - name
      WriteAttributes:
        - email
        - name

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: E-Swap administrators who can moderate listings.
      UserPoolId: !Ref UserPool
      Precedence: 1

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ESwapItems-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ownerId-createdAt-index
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: E-Swap
        - Key: Stage
          Value: !Ref StageName

  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ESwapRequests-${StageName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: requesterId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: requesterId-createdAt-index
          KeySchema:
            - AttributeName: requesterId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ownerId-createdAt-index
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Application
          Value: E-Swap
        - Key: Stage
          Value: !Ref StageName

  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - http://localhost:5173
              - !Ref FrontendOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Application
          Value: E-Swap
        - Key: Stage
          Value: !Ref StageName

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/eswap-${StageName}
      RetentionInDays: 14

  ESwapHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Description: E-Swap HTTP API
      DefinitionBody:
        openapi: 3.0.1
        info:
          title: E-Swap API
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowOrigins:
          - http://localhost:5173
          - !Ref FrontendOrigin
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub eswap-api-handler-${StageName}
      Description: Handles E-Swap listings, uploads, requests and admin moderation.
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
        - S3CrudPolicy:
            BucketName: !Ref ImagesBucket
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /health
            Method: GET
        ListItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /items
            Method: GET
        GetItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /items/{itemId}
            Method: GET
        CreateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /items
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
        MyItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /my-items
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        UpdateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /items/{itemId}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwtAuthorizer
        DeleteItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /items/{itemId}
            Method: DELETE
            Auth:
              Authorizer: CognitoJwtAuthorizer
        PresignUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /uploads/presign
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
        CreateRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /requests
            Method: POST
            Auth:
              Authorizer: CognitoJwtAuthorizer
        MyRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /my-requests
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        UpdateRequest:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /requests/{requestId}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwtAuthorizer
        AdminItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /admin/items
            Method: GET
            Auth:
              Authorizer: CognitoJwtAuthorizer
        ModerateItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref ESwapHttpApi
            Path: /admin/items/{itemId}
            Method: PATCH
            Auth:
              Authorizer: CognitoJwtAuthorizer

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DependsOn: ApiFunction
    Properties:
      LogGroupName: !Sub /aws/lambda/eswap-api-handler-${StageName}
      RetentionInDays: 14

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub https://${ESwapHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  AwsRegion:
    Description: AWS region for frontend configuration
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito web app client ID
    Value: !Ref UserPoolClient
  ImagesBucketName:
    Description: Private S3 image bucket
    Value: !Ref ImagesBucket
  ItemsTableName:
    Description: DynamoDB items table
    Value: !Ref ItemsTable
  RequestsTableName:
    Description: DynamoDB requests table
    Value: !Ref RequestsTable
